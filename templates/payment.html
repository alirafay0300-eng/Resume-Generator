<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <div class="container">
        <h1>Payment Page</h1>
        <p>Hello, <strong>{{ name }}</strong>. Please submit your payment details below.</p>

        <!-- ✅ Fixed space between method and enctype -->
        <form action="{{ url_for('payment_submit') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="{{ name }}" readonly required>
            </div>

            <div class="form-group">
                <label for="txn_id">Transaction ID</label>
                <input type="text" id="txn_id" name="txn_id" placeholder="Enter transaction ID" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount Paid (PKR)</label>
                <input type="number" step="0.01" min="1" id="amount" name="amount" placeholder="Enter amount" required>
            </div>

            <!-- <div class="form-group">
                <label for="screenshot">Upload Payment Screenshot</label>
                <input type="file" id="screenshot" name="screenshot" accept="image/*" required>
            </div>

            <button type="submit">Submit Payment</button> -->
        </form>

        <p style="margin-top: 15px;">After submitting, please wait for admin verification.</p>
    </div>
</body>
</html>
